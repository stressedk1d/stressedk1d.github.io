<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>To-Do List — 0bsession</title>
  <link rel="stylesheet" href="../mini-app.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mini-app">
    <a class="mini-app__back" href="https://stressedk1d.github.io/#mini-projects">← Портфолио</a>

    <header class="mini-app__header">
      <div class="mini-app__icon" aria-hidden="true">✓</div>
      <h1 class="mini-app__title">To-Do List</h1>
      <p class="mini-app__subtitle">Задачи сохраняются в браузере</p>
    </header>

    <div class="mini-app__card">
      <form class="todo-form" id="todo-form">
        <input class="input-field" type="text" id="new-task" placeholder="Новая задача…" autocomplete="off" maxlength="120">
        <button class="btn btn--primary" type="submit" id="add-task">Добавить</button>
      </form>

      <p class="todo-stats" id="todo-stats" aria-live="polite"></p>

      <ul class="todo-list" id="task-list"></ul>
      <p class="todo-empty" id="todo-empty">Пока нет задач — добавь первую</p>
    </div>

    <p class="mini-app__footer">0bsession · Vanilla JS</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
