<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>Угадай число — 0bsession</title>
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../mini-app.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mini-app">
    <a class="mini-app__back" href="https://stressedk1d.github.io/#mini-projects">← Портфолио</a>

    <header class="mini-app__header">
      <div class="mini-app__icon" aria-hidden="true">🎲</div>
      <h1 class="mini-app__title">Угадай число</h1>
      <p class="mini-app__subtitle">Компьютер загадал число от 1 до 100</p>
    </header>

    <div class="mini-app__card">
      <div class="guesser-meta">
        <div class="guesser-stat">
          <span class="guesser-stat__label">Попытки</span>
          <span class="guesser-stat__value" id="attempts-count">0 / 10</span>
        </div>
        <div class="guesser-stat">
          <span class="guesser-stat__label">Диапазон</span>
          <span class="guesser-stat__value" id="range-hint">1 — 100</span>
        </div>
      </div>

      <div class="guesser-progress" aria-hidden="true">
        <div class="guesser-progress__fill" id="attempts-bar"></div>
      </div>

      <form class="guesser-form" id="guesser-form">
        <input class="input-field" type="number" id="userInput" placeholder="Введите число" min="1" max="100" required>
        <div class="guesser-actions">
          <button class="btn btn--primary" type="submit" id="submitBtn">Угадать</button>
          <button class="btn btn--ghost" type="button" id="restartBtn">Заново</button>
        </div>
      </form>

      <div class="status-msg status-msg--info" id="output" role="status">Введи число и нажми «Угадать»</div>

      <div class="badge-row" id="history-row" hidden>
        <span class="badge" id="history-label">История:</span>
      </div>
      <div class="guesser-history" id="attempts"></div>
    </div>

    <p class="mini-app__footer">0bsession · JavaScript</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
