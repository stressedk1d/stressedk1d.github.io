name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cv.html"
      - "offline.html"
      - "styles.css"
      - "script.js"
      - "config.js"
      - "i18n.js"
      - "sw.js"
      - "manifest.json"
      - "favicon.svg"
      - "og-image.png"
      - "og-image.gif"
      - "generate_assets.py"
      - "fonts/**"
      - "images/**"
      - "icons/**"
      - "notes/**"
      - "panorama/**"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "projects/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate assets
        run: python generate_assets.py

      - name: Prepare site bundle
        run: |
          mkdir site-dist
          cp index.html cv.html offline.html styles.css script.js config.js i18n.js sw.js manifest.json favicon.svg og-image.png og-image.gif 404.html robots.txt sitemap.xml site-dist/
          cp -r fonts images icons projects panorama notes site-dist/
          touch site-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
