name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "config.js"
      - "i18n.js"
      - "sw.js"
      - "manifest.json"
      - "favicon.svg"
      - "og-image.png"
      - "images/**"
      - "icons/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site bundle
        run: |
          mkdir site-dist
          cp index.html styles.css script.js config.js i18n.js sw.js manifest.json favicon.svg og-image.png site-dist/
          cp -r images icons site-dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
